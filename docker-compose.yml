services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calc-app
    # No "ports:" here - the app is only reachable through nginx on the internal network
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: calc-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge
